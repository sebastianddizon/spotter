      <p class="small muted">Thirty seconds. Sleep, energy, stress and soreness decide whether today pushes, holds, or goes light.</p>
      <button class="btn primary block" style="margin-top:12px" data-act="checkin-open">${ICON.today} Check in</button></div>`;

  let session;
  if (done.length && !started) {
    const w = done[done.length - 1];
    const sets = (w.items || []).reduce((s, it) => s + it.sets.filter(x => x.done).length, 0);
    session = `<div class="card"><div class="card-h"><div><div class="eyebrow">Session done</div><div class="h2" style="margin-top:2px">${esc(w.dayName)}</div></div><span class="pill good">${ICON.check.replace('<svg', '<svg width="14" height="14"')} ${sets} set${sets === 1 ? '' : 's'}</span></div>
      <p class="small muted">Logged at ${LOC_LABEL[w.location]}. The next session picks up from here.</p>
      <div class="row" style="margin-top:10px"><button class="btn sm" data-act="go" data-v="train">View log</button></div></div>`;
  } else {
    const locSeg = `<div class="chips" role="group" aria-label="Where are you training">${(p.locations || ['gym']).concat('off').map(l => `<button class="chip" data-act="plan-loc" data-v="${l}" aria-pressed="${loc === l}">${l === 'gym' || l === 'hotworx' ? ICON.gym.replace('<svg', '<svg width="15" height="15" style="vertical-align:-3px"') : E.PLACES[l] ? ICON.home.replace('<svg', '<svg width="15" height="15" style="vertical-align:-3px"') : ICON.bed.replace('<svg', '<svg width="15" height="15" style="vertical-align:-3px"')} ${LOC_LABEL[l]}</button>`).join('')}</div>`;
    const minSeg = `<div class="chips">${[30, 45, 60, 75].map(m => `<button class="chip" data-act="plan-min" data-v="${m}" aria-pressed="${+min === m}">${m} min</button>`).join('')}</div>`;
    let inner = '';
    if (plan.type === 'train') {
      inner = `<div class="list" style="margin-top:6px">${plan.items.map((it, i) => `<div class="row between" style="padding:8px 0;flex-wrap:nowrap"><div style="min-width:0"><div style="font-weight:500">${it.pair ? `<span class="pill blue" style="margin-right:6px">${it.pair}</span>` : ''}${esc(it.ex.name)}</div><div class="tiny muted">${E.MUSCLES[it.muscle]}</div></div><div class="num" style="text-align:right;white-space:nowrap;font-family:var(--display);font-weight:600;font-size:16px">${it.sets} × ${it.reps}<div class="tiny muted" style="font-family:var(--body);font-weight:400">${it.load != null ? (it.ex.loc === 'p1' ? 'dial ' + it.load + ' kg' : it.load + ' lb') : 'pick a weight'}</div></div></div>`).join('')}</div>
        <div class="row" style="margin-top:12px">${started ? `<button class="btn primary block" data-act="go" data-v="train">${ICON.train} Continue session</button>` : `<button class="btn primary block" data-act="start-session">${ICON.train} Start ${esc(plan.dayName)}</button>`}</div>
        ${plan.readiness.band === 'red' ? `<button class="btn block ghost" style="margin-top:8px" data-act="plan-choice" data-v="walk">${ICON.walk} Swap for a recovery walk</button>` : ''}`;
    } else if (plan.type === 'recovery') {
      inner = `<p style="margin-top:8px">25 to 40 minutes of easy walking on the treadmill, then 10 minutes of mobility. ${esc(prog.days[plan.dayIndex].name)} moves to your next session.</p><button class="btn block" style="margin-top:10px" data-act="plan-choice" data-v="">Train light instead</button>`;
    } else {
      inner = `<p style="margin-top:8px" class="muted">Rest day. Steps and protein still count. Your next session is ${esc(prog.days[E.nextDayIndex(prog, allWorkouts(), t)].name)}.</p>${plan.condWeek < 2 ? `<button class="btn block" style="margin-top:10px" data-act="log-cond">${ICON.walk} Log 20 min conditioning</button>` : ''}`;
    }
    const hxBtn = (p.locations || []).includes('hotworx') ? `<button class="btn block ghost" style="margin-top:8px" data-act="hx-open">${ICON.bolt} Log a HOTWORX sauna session</button>` : '';
    const spBtn = (p.sports || []).some(x => x.k !== 'hotworx') ? `<button class="btn block ghost" style="margin-top:8px" data-act="sp-open">${ICON.bolt} Log ${esc((p.sports || []).filter(x => x.k !== 'hotworx').length === 1 ? 'a ' + E.SPORTBYK[(p.sports || []).find(x => x.k !== 'hotworx').k].name.toLowerCase() + ' session' : 'a sport or class')}</button>` : '';
    inner += hxBtn + spBtn;
    session = `<div class="card"><div class="card-h"><div><div class="eyebrow">Today's workout · week ${((wk - 1) % (prog.blockWeeks + 1)) + 1}${plan.deload ? ' · easy week' : ''}</div><div class="h2" style="margin-top:2px">${plan.type === 'train' ? esc(plan.dayName) : plan.type === 'recovery' ? 'Recovery walk' : 'Rest'}</div></div>${plan.type === 'train' ? `<span class="pill">${plan.minutesEst} min</span>` : ''}</div>
      <div class="stack" style="gap:8px">${locSeg}${plan.type !== 'rest' ? minSeg : ''}</div>${inner}</div>`;
  }

  const food = `<div class="card"><div class="card-h"><div class="eyebrow">${esc(tgt.label)}</div><button class="btn sm" data-act="go" data-v="food">${ICON.plus} Log food</button></div>
    <div class="row" style="gap:18px;flex-wrap:nowrap;margin-bottom:14px">${kcalRing(tot.kcal, tgt.kcal)}<div style="min-width:0"><div class="big num">${fmt(Math.abs(remaining))}</div><div class="small muted">${remaining >= 0 ? 'calories left today' : 'calories over today'}</div><div class="row small" style="gap:12px;margin-top:8px"><span class="mp"><b>${fmt(Math.max(0, tgt.protein - tot.protein))}g</b> protein to go</span></div></div></div>
    ${plateBars(tgt, tot)}
    <form data-form="log" class="row" style="flex-wrap:nowrap;gap:8px;margin-top:12px"><input class="inp" id="log-in-today" placeholder="What did you eat?" autocomplete="off"><button class="btn primary" type="submit">Log</button></form>
    ${nNotes.length ? `<div class="divider"></div><ul class="notes">${nNotes.map(n => `<li>${ICON.info}<span>${esc(n)}</span></li>`).join('')}</ul>` : ''}</div>`;

  const adj = plan.adjustments || [];
  const coachNotes = `<div class="card"><div class="card-h"><div class="eyebrow">Why today's plan looks like this</div>${S.sample ? `<button class="btn sm" data-act="brief">${ICON.spark} Ask coach about today</button>` : ''}</div>
    ${S.brief ? `<div class="msg ai" style="max-width:100%;margin-bottom:12px" aria-live="polite">${esc(S.brief.text || '')}${S.brief.loading && !S.brief.text ? '<span class="spinner"></span>' : ''}</div>` : ''}
    ${adj.length ? `<ul class="notes">${adj.map(n => `<li>${ICON.info}<span>${esc(n)}</span></li>`).join('')}</ul>` : '<p class="small muted">Normal day: the plan runs as written.</p>'}</div>`;

  const review = weeklyReviewDue() ? `<div class="card" style="border-color:var(--c)"><div class="row between"><div><div class="eyebrow">Weekly review</div><div class="h2" style="margin-top:2px">Check-in on your numbers</div><p class="small muted">Spotter looks at your week and adjusts your calories.</p></div><button class="btn primary sm" data-act="go" data-v="progress">Review</button></div></div>` : '';

  return `<div class="stack">
    <div class="row between" style="padding-top:6px"><div><div class="eyebrow">${esc(prettyDate(t))}</div><h1 class="h-display h1" style="margin-top:4px">${greeting()}${p.name ? ', ' + esc(p.name) : ''}</h1></div><span class="pill blue">${esc(phase)}</span></div>
    ${review}
    <div class="grid2"><div class="stack">${checkin}${session}</div><div class="stack">${food}${coachNotes}</div></div>
  </div>`;
}
function kcalRing(v, goal) {
  const R = 56, C = 2 * Math.PI * R, pct = Math.min(1, v / Math.max(1, goal)), over = v > goal * 1.05;
  return `<div class="ring" role="img" aria-label="${Math.round(pct * 100)}% of calories"><svg viewBox="0 0 132 132"><circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--surface2)" stroke-width="12"/><circle cx="66" cy="66" r="${R}" fill="none" stroke="${over ? 'var(--bad)' : 'var(--k)'}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - pct)).toFixed(1)}"/></svg><div class="rc"><b class="num">${Math.round(pct * 100)}%</b><span>eaten</span></div></div>`;
}
function greeting() { const h = new Date().getHours(); return h < 12 ? 'Morning' : h < 17 ? 'Afternoon' : 'Evening'; }
function weeklyReviewDue() { const last = nstate().lastReview || S.profile.created || today(); return E.daysBetween(last, today()) >= 7; }

/* ---------------- CHECK-IN SHEET ---------------- */
function sheetCheckin() {
  const d = day(today()); const c = d.checkin || { sleepHrs: d.wear?.sleepHrs || S.profile.sleepHrs || 7, sleepQ: 3, energy: 3, stress: S.profile.stress || 3, soreness: 2, soreAreas: [] };
  S.ui.ci = S.ui.ci || { ...c, weight: d.weight || '' , steps: c.steps || '' };
  const ci = S.ui.ci;
  const sc = (f, lo, hi) => `<div class="scale">${[1, 2, 3, 4, 5].map(n => `<button type="button" data-act="ci-set" data-f="${f}" data-v="${n}" aria-pressed="${+ci[f] === n}">${n}</button>`).join('')}</div><div class="row between tiny muted" style="margin-top:3px"><span>${lo}</span><span>${hi}</span></div>`;
  return `<div class="grab"></div><div class="stack">
    <div class="h2">Morning check-in</div>
    <label class="f">Sleep last night (hours)<div class="stepper"><button type="button" data-act="ci-step" data-f="sleepHrs" data-v="-0.5" aria-label="Less sleep">−</button><input id="ci-sleep" data-ci="sleepHrs" inputmode="decimal" value="${ci.sleepHrs}"><button type="button" data-act="ci-step" data-f="sleepHrs" data-v="0.5" aria-label="More sleep">+</button></div></label>
    <div class="f">Sleep quality${sc('sleepQ', 'Rough', 'Great')}</div>
    <div class="f">Energy${sc('energy', 'Flat', 'Wired')}</div>
    <div class="f">Stress${sc('stress', 'Calm', 'Stretched thin')}</div>
    <div class="f">Overall soreness${sc('soreness', 'None', 'Very sore')}</div>
    <div class="f">Anything sore?<div class="chips">${Object.entries(E.MUSCLES).filter(([k]) => !['frontdelts', 'abs'].includes(k)).map(([k, v]) => `<button type="button" class="chip" data-act="ci-sore" data-v="${k}" aria-pressed="${(ci.soreAreas || []).includes(k)}">${v}</button>`).join('')}</div></div>
    <div class="fields"><label class="f">Bodyweight (lb)<input class="inp" id="ci-weight" data-ci="weight" inputmode="decimal" value="${esc(ci.weight)}" placeholder="optional"></label><label class="f">Steps yesterday<input class="inp" id="ci-steps" data-ci="steps" inputmode="numeric" value="${esc(ci.steps)}" placeholder="optional"></label></div>
    <p class="tiny muted">Weigh in the morning after the bathroom. The trend line smooths daily water swings, so single readings never move your targets.</p>
    <button class="btn primary block" data-act="ci-save">Save check-in</button></div>`;
}

/* ---------------- TRAIN ---------------- */
function viewTrain() {
  const t = today(), d = day(t);
  const active = (d.workouts || []).find(w => !w.done);
  const hist = allWorkouts().filter(w => w.done).reverse().slice(0, 12);
  let body;
  if (active) body = sessionCard(active);
  else {
    const plan = todaysPlan();
    body = `<div class="card"><div class="eyebrow">Nothing in progress</div><div class="h2" style="margin-top:2px">${plan.type === 'train' ? 'Next up: ' + esc(plan.dayName) : 'Rest or recovery today'}</div>
      <p class="small muted" style="margin-top:4px">${plan.type === 'train' ? `${plan.items.length} exercises, about ${plan.minutesEst} minutes at ${LOC_LABEL[plan.location]}.` : 'You can still start a session if plans changed.'}</p>
      <div class="row" style="margin-top:12px"><button class="btn primary" data-act="start-session">${ICON.train} Start session</button><button class="btn" data-act="go" data-v="today">Change location or time</button></div></div>`;
  }
  const histHtml = hist.length ? `<div class="card"><div class="card-h"><div class="eyebrow">Recent sessions</div></div><div class="list">${hist.map(w => {
    const sets = (w.items || []).reduce((s, it) => s + it.sets.filter(x => x.done).length, 0);
    return `<details class="acc"><summary><span>${esc(w.dayName)} <span class="muted small" style="font-weight:400">· ${esc(prettyDate(w.date, { weekday: 'short', month: 'short', day: 'numeric' }))} · ${LOC_LABEL[w.location]}</span></span><span class="row" style="gap:6px;flex-wrap:nowrap"><span class="pill">${sets} sets</span>${ICON.chev.replace('<svg', '<svg width="16" height="16"')}</span></summary><div class="small">${(w.items || []).map(it => `<div style="padding:4px 0"><b style="font-weight:600">${esc(it.name)}</b><div class="muted mono">${it.sets.filter(s => s.done).map(s => `${s.load ?? '–'}${it.loc === 'p1' ? 'kg' : ''}×${s.reps}${s.rir != null ? '@' + s.rir : ''}`).join('  ') || 'no sets logged'}</div></div>`).join('')}</div></details>`;
  }).join('')}</div></div>` : '';
  return `<div class="stack"><div style="padding-top:6px"><div class="eyebrow">${esc(prettyDate(t))}</div><h1 class="h-display h1" style="margin-top:4px">Train</h1></div>${body}${histHtml}</div>`;
}

function sessionCard(w) {
  const done = w.items.reduce((s, it) => s + it.sets.filter(x => x.done).length, 0);
  const total = w.items.reduce((s, it) => s + it.sets.length, 0);
  return `<div class="card">
    <div class="card-h"><div><div class="eyebrow">${LOC_LABEL[w.location]} · ${done} of ${total} sets</div><div class="h2" style="margin-top:2px">${esc(w.dayName)}</div></div><button class="btn sm primary" data-act="finish-session">Finish</button></div>
    <div class="progress"><i style="width:${total ? done / total * 100 : 0}%"></i></div>
    ${w.notes?.length ? `<ul class="notes" style="margin-top:12px">${w.notes.map(n => `<li>${ICON.info}<span class="small">${esc(n)}</span></li>`).join('')}</ul>` : ''}
    <div class="list" style="margin-top:6px">${w.items.map((it, i) => exerciseBlock(w, it, i)).join('')}</div>
    <div class="row" style="margin-top:6px"><button class="btn sm" data-act="add-exercise">${ICON.plus} Add exercise</button><button class="btn sm ghost danger" data-act="discard-session" data-armed="${S.ui.discardArm ? 1 : 0}">${S.ui.discardArm ? 'Tap again to discard' : 'Discard session'}</button></div>
  </div>`;
}

function exerciseBlock(w, it, i) {
  const ex = E.EXBYID[it.exId] || { loc: it.loc, inc: E.placeOf(it.loc).inc, cables: 2 };
  const unit = E.unitOf(it.loc);
  const tag = it.main ? 'M' : it.pair ? it.pair : String(i + 1);
  const rpeMode = !!it.strength;
  return `<div class="ex" id="ex-${i}">
    <div class="ex-h"><div class="ex-tag ${it.main ? 'main' : it.pair ? 'pair' : ''}">${tag}</div>
      <div style="flex:1;min-width:0"><div class="ex-name">${esc(it.name)}</div>
        <div class="ex-meta">${E.MUSCLES[it.muscle] || ''} · ${it.sets.length} × ${esc(it.reps)} · ${it.rir ? 'stop ' + it.rir + ' rep' + (it.rir > 1 ? 's' : '') + ' early' : 'go until you can\'t do another'}${E.placeOf(it.loc).machine && ex.mode ? ` · <span class="pill" style="padding:1px 7px">${ex.mode} mode</span>` : ''}</div>
        ${loadLabel({ ...ex, loc: it.loc }, it.target)}
        ${it.cue ? `<div class="tiny muted" style="margin-top:5px">${esc(it.cue)}</div>` : ''}
        ${it.basis ? `<div class="basis">${esc(it.basis)}</div>` : ''}
      </div>
      ${it.main ? '' : `<button class="iconbtn" data-act="swap-open" data-i="${i}" aria-label="Swap exercise">${ICON.swap}</button>`}
    </div>
    <div class="sets">
      <div class="set set-h"><span>Set</span><span>${it.loc === 'p1' ? 'Dial kg' : unit}</span><span>Reps</span><span>Reps left</span><span></span></div>
      ${it.sets.map((s, j) => `<div class="set ${s.done ? 'done' : ''}">
        <span class="n">${j + 1}</span>
        <input id="s-${i}-${j}-l" data-set="load" data-i="${i}" data-j="${j}" inputmode="decimal" value="${s.load ?? ''}" placeholder="${it.target ?? '–'}" aria-label="Load set ${j + 1}">
        <input id="s-${i}-${j}-r" data-set="reps" data-i="${i}" data-j="${j}" inputmode="numeric" value="${s.reps ?? ''}" placeholder="${esc(String(it.repTarget ?? ''))}" aria-label="Reps set ${j + 1}">
        <select id="s-${i}-${j}-x" data-set="rir" data-i="${i}" data-j="${j}" aria-label="Reps you could still do set ${j + 1}">${(rpeMode ? [0, 0.5, 1, 1.5, 2, 3] : [0, 1, 2, 3, 4]).map(v => `<option value="${v}" ${(s.rir ?? it.rir) == v ? 'selected' : ''}>${String(v).replace('.5', '½').replace(/^0½$/, '½')}</option>`).join('')}</select>
        <button class="ok" data-act="set-done" data-i="${i}" data-j="${j}" aria-label="${s.done ? 'Undo set' : 'Mark set done'}">${ICON.check}</button>
      </div>${s.hint ? `<div class="hint">${esc(s.hint)}</div>` : ''}`).join('')}
    </div>
    <div class="row" style="margin-top:6px;gap:6px"><button class="btn sm ghost" data-act="set-add" data-i="${i}">${ICON.plus} Set</button>${it.sets.length > 1 ? `<button class="btn sm ghost" data-act="set-remove" data-i="${i}">Remove set</button>` : ''}</div>
  </div>`;
}

function sheetSwap(i) {
  const w = day(today()).workouts.find(x => !x.done); const it = w.items[i];
  const alts = E.EX.filter(e => e.loc === it.loc && !e.mainOnly && haveEquip(e) && (e.m === it.muscle || (e.sec || []).includes(it.muscle)) && e.id !== it.exId)
    .sort((a, b) => (a.m === it.muscle ? 0 : 1) - (b.m === it.muscle ? 0 : 1) || a.tier - b.tier);
  return `<div class="grab"></div><div class="stack"><div><div class="eyebrow">Swap</div><div class="h2">${esc(it.name)}</div><p class="small muted">Pick a replacement for ${E.MUSCLES[it.muscle]}. "Keep" makes it the default for this slot from now on.</p></div>
    <div class="list">${alts.map(e => `<div class="row between" style="padding:10px 0;flex-wrap:nowrap"><div style="min-width:0"><div style="font-weight:500">${esc(e.name)} ${e.tier === 1 ? '<span class="pill good">Best pick</span>' : ''}</div><div class="tiny muted">${esc(e.cue)}</div></div><div class="row" style="flex-wrap:nowrap;gap:6px"><button class="btn sm" data-act="swap-do" data-i="${i}" data-v="${e.id}">Today</button><button class="btn sm primary" data-act="swap-do" data-i="${i}" data-v="${e.id}" data-keep="1">Keep</button></div></div>`).join('') || '<p class="muted">No alternatives at this location.</p>'}</div>
    <button class="btn ghost danger" data-act="avoid-ex" data-i="${i}">Never program ${esc(it.name)}</button></div>`;
}

function sheetAddExercise() {
  const w = day(today()).workouts.find(x => !x.done);
  const list = E.EX.filter(e => e.loc === w.location && !e.mainOnly && haveEquip(e));
  return `<div class="grab"></div><div class="stack"><div class="h2">Add exercise</div><div class="list">${Object.keys(E.MUSCLES).map(m => {
    const xs = list.filter(e => e.m === m); if (!xs.length) return '';
    return `<details class="acc"><summary>${E.MUSCLES[m]} ${ICON.chev.replace('<svg', '<svg width="16" height="16"')}</summary><div>${xs.map(e => `<button class="btn sm" style="margin:3px" data-act="add-ex-do" data-v="${e.id}">${esc(e.name)}</button>`).join('')}</div></details>`;
  }).join('')}</div></div>`;
}

/* ---------------- FOOD ---------------- */
const MEALS = ['Breakfast', 'Lunch', 'Dinner', 'Snacks'];
function defaultMeal() { const h = new Date().getHours(); return h < 10 ? 'Breakfast' : h < 15 ? 'Lunch' : h < 21 ? 'Dinner' : 'Snacks'; }

function viewFood() {
  const date = S.foodDate, d = day(date), tgt = targetFor(date), tot = E.dayTotals(d.food);
  const isToday = date === today();
  const ai = !!S.sample;
  const add = (act, icon, lab, dis) => `<button class="add" data-act="${act}" ${dis ? 'disabled title="Needs Claude access"' : ''} style="${dis ? 'opacity:.45' : ''}">${icon}${lab}</button>`;
  const recent = (S.lib.recent || []).slice(0, 10);
  return `<div class="stack">
    <div class="row between" style="padding-top:6px;flex-wrap:nowrap"><button class="iconbtn" data-act="food-day" data-v="-1" aria-label="Previous day">${ICON.left}</button>
      <div style="text-align:center"><div class="eyebrow">${isToday ? 'Today' : esc(prettyDate(date, { weekday: 'long' }))}</div><div class="h-display" style="font-size:24px;margin-top:2px">${esc(prettyDate(date, { month: 'long', day: 'numeric' }))}</div></div>
      <button class="iconbtn" data-act="food-day" data-v="1" aria-label="Next day" ${isToday ? 'disabled style="opacity:.35"' : ''}>${ICON.right}</button></div>
    <div class="grid2">
      <div class="stack">
        <div class="card"><div class="card-h"><div><div class="eyebrow">${esc(tgt.label)}</div><div class="big num" style="margin-top:4px">${fmt(tot.kcal)}<small>of ${fmt(tgt.kcal)} kcal</small></div></div></div>${plateBars(tgt, tot)}
        ${tgt.note ? `<p class="tiny muted" style="margin-top:10px">${esc(tgt.note)}</p>` : ''}</div>
        ${logBox()}
        ${(S.profile.supps || []).length ? `<div class="card"><div class="card-h"><div class="eyebrow">Supplements</div><div class="tiny muted">${(d.supps || []).filter(id => S.profile.supps.some(x => x.id === id)).length} of ${S.profile.supps.length} taken</div></div><div class="chips">${S.profile.supps.map(x => `<button class="chip" data-act="sup-take" data-v="${x.id}" aria-pressed="${(d.supps || []).includes(x.id)}">${esc(x.name)}${x.kcal ? ` <span style="opacity:.7">${fmt(x.kcal)} kcal</span>` : ''}</button>`).join('')}</div><p class="tiny muted" style="margin-top:8px">Tap what you took. Anything with calories is added to your day. Change your list in Settings under Profile and plan.</p></div>` : ''}
        <div class="card"><div class="eyebrow" style="margin-bottom:10px">Other ways to add</div>

/* ---------------- PROGRESS ---------------- */
function weightChart(ws) {
  const tr = E.trendSeries(ws).slice(-60);
  if (tr.length < 2) return `<div class="empty">${ICON.scale}<div>Weigh in on a few mornings and the trend line appears here.</div></div>`;
  const W = 640, H = 200, pl = 36, pr = 10, pt = 12, pb = 22;
  const lo = Math.floor(Math.min(...tr.map(x => Math.min(x.lb, x.trend))) - 1), hi = Math.ceil(Math.max(...tr.map(x => Math.max(x.lb, x.trend))) + 1);
  const t0 = new Date(tr[0].date).getTime(), t1 = new Date(tr[tr.length - 1].date).getTime() || t0 + 1;
  const X = d => pl + (new Date(d).getTime() - t0) / Math.max(1, t1 - t0) * (W - pl - pr), Y = v => pt + (hi - v) / (hi - lo) * (H - pt - pb);
  const ticks = []; const step = Math.max(1, Math.round((hi - lo) / 4)); for (let v = lo; v <= hi; v += step) ticks.push(v);
  const line = tr.map((x, i) => `${i ? 'L' : 'M'}${X(x.date).toFixed(1)} ${Y(x.trend).toFixed(1)}`).join('');
  const area = line + `L${X(tr[tr.length - 1].date).toFixed(1)} ${H - pb}L${X(tr[0].date).toFixed(1)} ${H - pb}Z`;
  const last = tr[tr.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend, latest ${last.trend} lb">
    ${ticks.map(v => `<line x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl - 6}" y="${Y(v) + 3}" text-anchor="end">${v}</text>`).join('')}
    <path d="${area}" fill="var(--k)" opacity=".10"/>
    ${tr.map(x => `<circle cx="${X(x.date).toFixed(1)}" cy="${Y(x.lb).toFixed(1)}" r="2.6" fill="var(--ink3)" opacity=".7"/>`).join('')}
    <path d="${line}" fill="none" stroke="var(--k)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${X(last.date)}" cy="${Y(last.trend)}" r="5" fill="var(--k)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${pl}" y="${H - 6}">${esc(prettyDate(tr[0].date, { month: 'short', day: 'numeric' }))}</text><text x="${W - pr}" y="${H - 6}" text-anchor="end">${esc(prettyDate(last.date, { month: 'short', day: 'numeric' }))}</text>
  </svg>`;
}

function weeklyVolume() {
  const since = E.addDays(today(), -6), vol = {};
  allWorkouts().filter(w => w.done && w.date >= since).forEach(w => (w.items || []).forEach(it => {
    const n = it.sets.filter(s => s.done).length; const ex = E.EXBYID[it.exId];
    vol[it.muscle] = (vol[it.muscle] || 0) + n;
    (ex?.sec || []).forEach(m => vol[m] = (vol[m] || 0) + n * 0.5);
  }));
  return vol;
}

function viewProgress() {
  const ws = weights(), tr = E.trendSeries(ws), T = targets(), p = S.profile;
  const lastT = tr.length ? tr[tr.length - 1].trend : null;
  const wkAgo = tr.filter(x => x.date <= E.addDays(today(), -7)).pop();
  const rate = lastT && wkAgo ? lastT - wkAgo.trend : null;
  const intake = intakeByDate();
  const days7 = Array.from({ length: 7 }, (_, i) => E.addDays(today(), -i - 1));
  const logged = days7.filter(d => intake[d]).length;
  const avgK = logged ? Math.round(E.avg(days7.filter(d => intake[d]).map(d => intake[d]))) : null;
  const prot7 = days7.map(d => S.days[d] ? E.dayTotals(S.days[d].food).protein : 0).filter(x => x > 0);
  const vol = weeklyVolume(); const tgtVol = program().volume.sets;
  const rv = S.ui.review;
  const hist = setsHistory();
  const top = Object.entries(hist).sort((a, b) => b[1].length - a[1].length).slice(0, 6);
  const rateGoal = p.goal === 'fatloss' ? -(p.weightLb * T.ratePct / 100) : null;
  return `<div class="stack"><div style="padding-top:6px"><div class="eyebrow">Last 60 days</div><h1 class="h-display h1" style="margin-top:4px">Progress</h1></div>
    <div class="tiles">
      <div class="tile"><div class="k">Average weight</div><div class="v num">${lastT ? fmt(lastT, 1) : '–'}<span class="small muted"> lb</span></div></div>
      <div class="tile"><div class="k">7-day change</div><div class="v num" style="color:${rate == null ? 'var(--ink)' : (p.goal === 'fatloss' ? (rate < 0 ? 'var(--good)' : 'var(--warn)') : 'var(--ink)')}">${rate == null ? '–' : (rate > 0 ? '+' : '') + fmt(rate, 2)}</div><div class="tiny muted">${rateGoal ? 'target ' + fmt(rateGoal, 1) + '/wk' : ''}</div></div>
      <div class="tile"><div class="k">Avg intake (7d)</div><div class="v num">${avgK ? fmt(avgK) : '–'}</div><div class="tiny muted">${logged}/7 days logged</div></div>
      <div class="tile"><div class="k">Avg protein</div><div class="v num mp">${prot7.length ? fmt(E.avg(prot7)) : '–'}<span class="small muted"> g</span></div><div class="tiny muted">target ${T.base.protein} g</div></div>
    </div>
    <div class="grid2"><div class="stack">
      <div class="card"><div class="card-h"><div class="eyebrow">Weight · dots are weigh-ins, the line is your average</div><button class="btn sm" data-act="checkin-open">${ICON.scale} Log</button></div>${weightChart(ws)}</div>
      <div class="card"><div class="card-h"><div><div class="eyebrow">Weekly check-up</div><div class="h2" style="margin-top:2px">Adjust your calories</div></div>${rv ? '' : `<button class="btn sm primary" data-act="review-run">Check my week</button>`}</div>
        <p class="small muted">You eat ${fmt(T.base.kcal)} calories a day and burn about ${fmt(T.tdee)}${p.nutrition?.tdeeOverride ? ' (measured from your logs)' : ' (estimated)'}. Last review: ${nstate().lastReview ? esc(prettyDate(nstate().lastReview, { month: 'short', day: 'numeric' })) : 'never'}.</p>
        ${rv ? `<ul class="notes" style="margin-top:10px">${rv.notes.map(n => `<li>${ICON.info}<span class="small">${esc(n)}</span></li>`).join('')}</ul>
          <div class="tiles" style="margin-top:12px"><div class="tile"><div class="k">Now</div><div class="v num">${fmt(T.base.kcal)}</div></div><div class="tile"><div class="k">Proposed</div><div class="v num mk">${fmt(rv.newKcal)}</div><div class="tiny muted">${rv.newKcal - T.base.kcal >= 0 ? '+' : ''}${rv.newKcal - T.base.kcal} kcal</div></div></div>
          <div class="row" style="margin-top:12px"><button class="btn" data-act="review-dismiss">Keep current</button><button class="btn primary" data-act="review-apply">Use new calories${rv.dietBreak ? ' and start break' : ''}</button></div>` : ''}
      </div>
    </div><div class="stack">
      <div class="card"><div class="card-h"><div class="eyebrow">Work done this week, by body part</div></div>
        <div class="plates">${Object.keys(E.MUSCLES).filter(m => tgtVol[m] > 0).map(m => { const v = vol[m] || 0, g = tgtVol[m] || 1; return `<div class="plate" style="--col:${v >= g * 0.9 ? 'var(--good)' : v >= g * 0.5 ? 'var(--warn)' : 'var(--ink3)'}"><div class="lab" style="font-weight:500">${E.MUSCLES[m]}</div><div class="bar"><i style="width:${Math.min(100, v / g * 100)}%"></i></div><div class="val num">${fmt(v, v % 1 ? 1 : 0)}<span> / ${g}</span></div></div>`; }).join('')}</div>
        <p class="tiny muted" style="margin-top:10px">Bars fill as you train each area. Exercises that work an area indirectly count half.</p></div>
      <div class="card"><div class="card-h"><div class="eyebrow">Strength over time</div></div>
        ${top.length ? `<div class="list">${top.map(([id, rows]) => { const ex = E.EXBYID[id]; const byD = {}; rows.forEach(r => byD[r.date] = Math.max(byD[r.date] || 0, E.e1rm(r.load, r.reps, r.rir))); const ds = Object.keys(byD).sort(); const vals = ds.map(d => byD[d]); const first = vals[0], lastv = vals[vals.length - 1]; const ch = first ? (lastv / first - 1) * 100 : 0;
          return `<div class="row between" style="padding:9px 0;flex-wrap:nowrap"><div style="min-width:0"><div style="font-weight:500">${esc(ex?.name || id)}</div><div class="tiny muted">${ds.length} session${ds.length === 1 ? '' : 's'}</div></div>${spark(vals)}<div style="text-align:right;min-width:74px"><div class="num" style="font-family:var(--display);font-weight:700;font-size:18px">${fmt(lastv, 1)} ${ex?.loc === 'p1' ? 'kg' : 'lb'}</div><div class="tiny" style="color:${ch >= 0 ? 'var(--good)' : 'var(--bad)'}">${ch >= 0 ? '+' : ''}${fmt(ch, 1)}%</div></div></div>`; }).join('')}</div>` : `<div class="empty">${ICON.train}<div>Log a couple of sessions to see strength trends.</div></div>`}</div>
    </div></div></div>`;
}
function spark(vals) {
  if (vals.length < 2) return '<span></span>';
  const W = 80, H = 26, lo = Math.min(...vals), hi = Math.max(...vals) || 1;
  const pts = vals.map((v, i) => `${(i / (vals.length - 1) * W).toFixed(1)},${(H - 3 - (v - lo) / Math.max(0.001, hi - lo) * (H - 6)).toFixed(1)}`).join(' ');
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true" style="flex:none"><polyline points="${pts}" fill="none" stroke="var(--c)" stroke-width="2" stroke-linejoin="round"/></svg>`;
}

/* ============================================================
   FOOD DATABASE + NATURAL-LANGUAGE LOGGING + RECIPES
   USDA FoodData Central (Branded, April 2026) shipped as data files next to the page:
     food/bmeta.json, food/bi/<shard>.json (items), food/bt/<bucket>.json (search), food/bu/<nn>.json (barcodes)
   Optional generic set (Foundation / SR Legacy / FNDDS): food/gmeta.json, food/gi, food/gt
   Item row: [name, brand, upc, servingQty, servingUnit(g|ml), householdText, kcal, protein, carbs, fat, fiber, category]  (per serving)
   ============================================================ */
const FoodDB = {
  cache: new Map(), meta: {},
  async j(path) {
    if (this.cache.has(path)) return this.cache.get(path);
    const p = fetch(path).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
    this.cache.set(path, p);
    try { return await p; } catch (e) { this.cache.delete(path); throw e; }
  },
  async metaFor(db) { if (!(db in this.meta)) { try { this.meta[db] = await this.j(`food/${db}meta.json`); } catch (e) { this.meta[db] = null; } } return this.meta[db]; },
  toks(s) {
    const STOP = new Set('and with the of in for a an or to on by from no not oz fl lb g ml pack ct count size per each'.split(' '));
    const out = new Set();
    (String(s).toLowerCase().replace(/'/g, '').match(/[a-z0-9]+/g) || []).forEach(w => {
      if (w.length < 2 || STOP.has(w) || (/^\d+$/.test(w) && w.length > 3)) return;
      if (w.length > 3 && w.endsWith('s') && !w.endsWith('ss')) w = w.slice(0, -1);
      out.add(w);
    });
    return [...out];
  },
  crc(str) { let c, crc = 0 ^ (-1); for (let i = 0; i < str.length; i++) { c = (crc ^ str.charCodeAt(i)) & 0xFF; for (let k = 0; k < 8; k++) c = c & 1 ? (c >>> 1) ^ 0xEDB88320 : c >>> 1; crc = (crc >>> 8) ^ c; } return (crc ^ (-1)) >>> 0; },
  row(db, id, r) { return { db, id, name: r[0], brand: r[1], upc: r[2], sq: r[3], su: r[4], hh: r[5], kcal: r[6], protein: r[7], carbs: r[8], fat: r[9], fiber: r[10], cat: r[11], ports: r[12] || null }; },
  async item(db, id) { const m = await this.metaFor(db); const sh = await this.j(`food/${db}i/${Math.floor(id / m.shard)}.json`); return this.row(db, id, sh[id % m.shard]); },
  /** Search one database. Returns up to `limit` rows ranked by matched tokens, brand hits, then shorter names. */
  async searchDb(db, query, brand, limit = 8) {
    const m = await this.metaFor(db); if (!m) return [];
    const qt = this.toks(query), bt = this.toks(brand || '');
    const all = [...new Set([...qt, ...bt])]; if (!all.length) return [];
    const lists = await Promise.all(all.map(async t => {
      const b = await this.j(`food/${db}t/${this.crc(t) % m.tb}.json`); const d = b[t]; if (!d) return [t, []];
      const ids = []; let acc = 0; d.forEach((x, i) => { acc = i ? acc + x : x; ids.push(acc); }); return [t, ids];
    }));
    const score = new Map();
    lists.forEach(([t, ids]) => { const w = bt.includes(t) ? 2 : 1; ids.forEach(id => score.set(id, (score.get(id) || 0) + w)); });
    const need = qt.length + bt.length * 2;
    let cands = [...score.entries()].filter(([, s]) => s >= Math.max(1, need - (need > 3 ? 2 : 1))).sort((a, b) => b[1] - a[1]).slice(0, 120);
    if (!cands.length) return [];
    // fetch at most 4 shards, the ones holding the best candidates
    const byShard = new Map(); cands.forEach(([id, s]) => { const k = Math.floor(id / m.shard); byShard.set(k, (byShard.get(k) || 0) + s); });
    const shards = [...byShard.entries()].sort((a, b) => b[1] - a[1]).slice(0, 4).map(x => x[0]);
    const loaded = {}; await Promise.all(shards.map(async k => loaded[k] = await this.j(`food/${db}i/${k}.json`)));
    const rows = cands.filter(([id]) => loaded[Math.floor(id / m.shard)]).map(([id, s]) => ({ ...this.row(db, id, loaded[Math.floor(id / m.shard)][id % m.shard]), score: s }));
    const qset = new Set(qt);
    const ODD = this.oddT || (this.oddT = this.toks('breaded battered coated fried glutinous ingredient microwaved canned frozen dehydrated dried baby infant imitation tender nugget patty restaurant fast reduced substitute mix powder dry unprepared butter margarine sauce gravy oil')); 
    rows.forEach(r => { const nt = this.toks(r.name); r.score += nt.filter(t => qset.has(t)).length * 0.3 - Math.max(0, nt.length - qt.length) * 0.06 - nt.filter(t => ODD.includes(t) && !qset.has(t)).length * 0.5 + (/skin not eaten|meat only/i.test(r.name) ? 0.2 : 0); });
    return rows.sort((a, b) => b.score - a.score).slice(0, limit);
  },
  async search(query, brand, limit = 8, restaurant = false) {
    const hasG = !!(await this.metaFor('g')), hasR = !!(await this.metaFor('r'));
    if (restaurant && hasR) { const r = await this.searchDb('r', query, brand, limit); if (r.length) return r.map(x => ({ ...x, score: x.score + 1 })); }
    const [g, b, r] = await Promise.all([hasG && !brand ? this.searchDb('g', query, '', limit) : [], this.searchDb('b', query, brand, limit), hasR ? this.searchDb('r', query, brand, limit) : []]);
    if (brand && r.length && r[0].score >= 2) return [...r.map(x => ({ ...x, score: x.score + 1 })), ...b].sort((x, y) => y.score - x.score).slice(0, Math.max(limit, 8));
    // generic rows get a small edge so plain foods (eggs, rice) beat a random brand; brand words in the query still win
    return [...g.map(x => ({ ...x, score: x.score + 0.4 })), ...r.map(x => ({ ...x, score: x.score + 0.2 })), ...b].sort((x, y) => y.score - x.score).slice(0, Math.max(limit, 8));
  },
  async byUpc(code) {
    const c = String(code).replace(/\D/g, '').replace(/^0+/, ''); if (c.length < 6) return null;
    try { const b = await this.j(`food/bu/${+c.slice(-2)}.json`); const id = b[c]; return id == null ? null : await this.item('b', id); } catch (e) { return null; }
  }
};

/* ---------- unit math ---------- */
const UNIT_G = { g: 1, gram: 1, grams: 1, kg: 1000, oz: 28.35, ounce: 28.35, lb: 453.6, pound: 453.6, ml: 1, floz: 29.57, l: 1000, cup: 240, tbsp: 15, tsp: 5 };
const COUNT_UNITS = ['serving', 'servings', 'bottle', 'can', 'bar', 'scoop', 'piece', 'packet', 'pouch', 'container', 'cup_container', 'bag', 'each', 'whole', 'large', 'medium', 'small', 'slice', 'stick', 'egg', 'item'];
/** How many label servings a parsed amount equals for a database row. */
const PORT_WORDS = { cup: /\bcups?\b/, tbsp: /\b(tbsp|tablespoons?)\b/, tsp: /\b(tsp|teaspoons?)\b/, slice: /\bslices?\b/, large: /\blarge\b/, medium: /\bmedium\b/, small: /\bsmall\b/, piece: /\b(pieces?|each|whole|item)\b/ };
function portionGrams(row, unit) {
  if (!row.ports) return null;
  const re = PORT_WORDS[unit] || (COUNT_UNITS.includes(unit) ? new RegExp('\\b' + unit + 's?\\b') : null);
  const hits = re ? row.ports.filter(([l]) => re.test(l.toLowerCase())) : [];
  let p = hits.find(([l]) => /medium|regular/.test(l.toLowerCase())) || hits[0] || null;
  if (!p && ['piece', 'each', 'whole', 'item', 'serving'].includes(unit)) p = row.ports.find(([l]) => !/cup|tbsp|tablespoon|tsp|teaspoon|oz|ounce|gram/.test(l.toLowerCase()));
  if (!p) return null;
  const n = parseFloat(p[0]) || 1;
  return p[1] / n;
}
function servingsFor(row, it) {
  const u = String(it.unit || '').toLowerCase().replace(/\.$/, '');
  const sq = +row.sq || 0;
  if (row.ports && sq) {
    if (['g', 'gram', 'grams', 'kg', 'oz', 'ounce', 'lb', 'pound', 'ml', 'floz', 'l'].includes(u)) return +((it.qty || 1) * UNIT_G[u] / sq).toFixed(2);
    const pg = portionGrams(row, u);
    // trust the USDA portion unless it disagrees wildly with Claude's own gram estimate
    if (pg && !(it.grams && (pg * (it.qty || 1) > it.grams * 2.5 || pg * (it.qty || 1) < it.grams / 2.5))) return +((it.qty || 1) * pg / sq).toFixed(2);
    if (it.grams) return +(it.grams / sq).toFixed(2);
  }
  if (UNIT_G[u] && sq) {
    if (['cup', 'tbsp', 'tsp'].includes(u)) {   // volume: use the label's household text when it names the same unit
      const hh = String(row.hh || '').toLowerCase(); const m = hh.match(/([\d.\/]+)\s*(cup|tbsp|tablespoon|tsp|teaspoon)/);
      if (m) { const q = m[1].includes('/') ? m[1].split('/').reduce((a, b) => a / b) : +m[1]; const hu = m[2].startsWith('cup') ? 'cup' : m[2].startsWith('tb') || m[2].startsWith('tablespoon') ? 'tbsp' : 'tsp'; if (hu === u && q > 0) return +(it.qty / q).toFixed(2); }
      if (it.grams && sq) return +(it.grams / sq).toFixed(2);
    }
    return +((it.qty || 1) * UNIT_G[u] / sq).toFixed(2);
  }
  if (COUNT_UNITS.includes(u) || !u) return +(it.qty || 1).toFixed(2);
  if (it.grams && sq) return +(it.grams / sq).toFixed(2);
  return +(it.qty || 1).toFixed(2);
}
function scaleRow(row, servings) { return { kcal: row.kcal * servings, protein: row.protein * servings, carbs: row.carbs * servings, fat: row.fat * servings, fiber: (row.fiber || 0) * servings }; }
function titleCase(s) { return String(s || '').toLowerCase().replace(/\b([a-z])/g, c => c.toUpperCase()).replace(/\s+/g, ' ').trim(); }
function rowLabel(r) { const n = [...new Set(titleCase(r.name).replace(/,\s*$/, '').split(/,\s*/))].join(', '); return r.brand && !n.toLowerCase().includes(r.brand.toLowerCase()) ? `${titleCase(r.brand)} ${n}` : n; }
function servingText(r) { return r.hh ? `${r.hh}${r.sq ? ` (${Math.round(r.sq)} ${r.su})` : ''}` : r.sq ? `${Math.round(r.sq)} ${r.su}` : '1 serving'; }

/* ---------- local matching against saved foods, meals and recipes (no Claude) ---------- */
function parseAmountPrefix(s) {
  const m = s.trim().match(/^(\d+(?:\.\d+)?|\d+\/\d+|half|a|an|one|two|three)\s*(g|grams?|oz|servings?|bowls?|plates?|portions?|cups?|x)?\s*(?:of\s+)?(.*)$/i);
  if (!m) return { qty: 1, unit: '', name: s.trim() };
  const w = { half: 0.5, a: 1, an: 1, one: 1, two: 2, three: 3 };
  const q = w[m[1].toLowerCase()] ?? (m[1].includes('/') ? m[1].split('/').reduce((a, b) => a / b) : +m[1]);
  return { qty: q, unit: (m[2] || '').toLowerCase(), name: m[3].trim() };
}
function localMatch(text) {
  const parts = text.split(/\s*(?:,|\+|\band\b|\n)\s*/i).filter(Boolean);
  const lib = S.lib; const out = [];
  for (const p of parts) {
    const a = parseAmountPrefix(p); const nm = a.name.toLowerCase().replace(/^(my|the)\s+/, '');
    const rec = (lib.recipes || []).find(r => r.name.toLowerCase() === nm || nm === r.name.toLowerCase() + 's');
    if (rec) {
      const servings = (a.unit === 'g' || a.unit === 'gram' || a.unit === 'grams') && rec.totalGrams ? a.qty / rec.totalGrams * rec.servings : a.unit === 'oz' && rec.totalGrams ? a.qty * 28.35 / rec.totalGrams * rec.servings : a.qty;
      out.push({ text: p, kind: 'recipe', name: rec.name, servings: +servings.toFixed(2), per: rec.perServing, unitLabel: rec.servingName || 'serving' }); continue;
    }
    const meal = (lib.meals || []).find(r => r.name.toLowerCase() === nm);
    if (meal) { out.push({ text: p, kind: 'meal', name: meal.name, servings: a.qty, per: meal.total, unitLabel: 'meal' }); continue; }
    const fav = (lib.recent || []).find(r => r.name.toLowerCase() === nm);
    if (fav && a.unit === '') { out.push({ text: p, kind: 'saved', name: fav.name, servings: a.qty, per: fav, unitLabel: 'serving' }); continue; }
    return null;   // anything unmatched sends the whole line to Claude
  }
  return out.length ? out : null;
}

/* ---------- Claude parse: splits the line, the page does the lookups and the math ---------- */
async function aiParseFood(text) {
  const prompt = `Split this food log into separate foods for a US nutrition database lookup.
For each food return:
- "text": the phrase it came from
- "query": 2 to 5 plain search words a USDA database would use (e.g. "chicken breast cooked", "white rice cooked", "egg whole scrambled")
- "brand": the brand or chain if named, else ""
- "qty": the number eaten, "unit": one of g, oz, lb, ml, floz, cup, tbsp, tsp, serving, bottle, can, bar, scoop, piece, slice, large, medium, small
- "grams": your best estimate of the total grams (or ml) eaten
- "est": your own estimate for the whole amount {"kcal","protein","carbs","fat","fiber"}, used only if the database has no match
- "restaurant": true for restaurant or fast-food items; then "brand" is the chain (e.g. "Chick-fil-A") and "query" is the menu item's name as the chain lists it, with size (e.g. "spicy chicken sandwich", "waffle potato fries medium")
- Split restaurant meals into the separately listed menu items (sandwich, fries, drink, sauce)
Count cooking fat (butter, oil) as its own item when the user mentions it.
Return only JSON: {"items":[...]}

Food log: ${text}`;
  return await S.sample.json(prompt, { modelTier: 'quick' });
}

/** Resolve parsed items against the database. Branded items need the brand; generic items prefer the generic set. */
async function resolveItems(parsed) {
  const hasG = !!(await FoodDB.metaFor('g'));
  return await Promise.all((parsed.items || []).map(async it => {
    const res = { text: it.text, query: it.query, brand: it.brand || '', qty: +it.qty || 1, unit: it.unit || '', grams: +it.grams || null, est: it.est || null, restaurant: !!it.restaurant, cands: [], pick: -1 };
    try { res.cands = await FoodDB.search(it.query, it.brand, 8, !!it.restaurant); } catch (e) { res.cands = []; }
    if (it.restaurant) {
      // chain items: use the chain's published numbers when the chain matches, else Claude's estimate
      const bt = FoodDB.toks(it.brand || '');
      const k = res.cands.findIndex(c => c.db === 'r' && bt.length && bt.every(t => FoodDB.toks(c.brand).includes(t)));
      res.pick = k;
    } else {
      const ok = res.cands.findIndex(c => (it.brand ? true : c.db === 'g'));
      res.pick = it.brand ? (res.cands.length ? 0 : -1) : (hasG && ok >= 0 ? ok : -1);
    }
    res.servings = res.pick >= 0 ? servingsFor(res.cands[res.pick], res) : 1;
    return res;
  }));
}
function itemMacros(it) {
  if (it.kind) return scaleRow(it.per, it.servings);
  if (it.pick >= 0) return scaleRow(it.cands[it.pick], it.servings);
  const e = it.est || {}; const m = it.estMult ?? 1;
  return { kcal: (+e.kcal || 0) * m, protein: (+e.protein || 0) * m, carbs: (+e.carbs || 0) * m, fat: (+e.fat || 0) * m, fiber: (+e.fiber || 0) * m };
}
function itemName(it) { return it.kind ? it.name : it.pick >= 0 ? rowLabel(it.cands[it.pick]) : titleCase(it.text); }

/* ---------- flows ---------- */
async function startLog(text) {
  text = (text || '').trim(); if (!text) return;
  const local = localMatch(text);
  S.sheet = { type: 'food', food: { kind: 'log', stage: 'resolve', text, meal: S.foodDate === today() ? defaultMeal() : 'Snacks', items: local || [], busy: !local, local: !!local } };
  render();
  if (local) return;
  if (!S.sample) { S.sheet.food.busy = false; S.sheet.food.err = 'Typed logging needs Claude for anything not already saved. Allow Claude for this page from the artifact menu.'; return render(); }
  try {
    const parsed = await aiParseFood(text);
    S.sheet.food.items = await resolveItems(parsed);
    if (!S.sheet.food.items.length) throw { code: 'invalid_json' };
  } catch (e) { S.sheet.food.err = e?.message && !e.code ? 'The food database did not load. Check your connection and try again.' : aiError(e); }
  S.sheet.food.busy = false; render();
}

function saveLogged() {
  const f = S.sheet.food;
  f.items.forEach(it => {
    const m = itemMacros(it);
    const amount = it.kind ? `${fmt(it.servings, it.servings % 1 ? 2 : 0)} ${it.unitLabel}` : it.pick >= 0 ? `${fmt(it.servings, it.servings % 1 ? 2 : 0)} × ${servingText(it.cands[it.pick])}` : '';
    addFood({ name: itemName(it) + (amount ? ` (${amount})` : ''), ...m, meal: f.meal, source: it.kind ? it.kind : it.pick >= 0 ? 'usda' : 'describe' });
    if (it.pick >= 0) rememberFood(it.cands[it.pick]);
  });
  if (f.recipe) saveRecipeFrom(f);
  S.sheet = null; toast(f.recipe ? 'Recipe saved' : 'Logged'); render();
}

function rememberFood(row) {
  S.lib.myfoods = (S.lib.myfoods || []).filter(x => !(x.name === row.name && x.brand === row.brand));
  S.lib.myfoods.unshift({ ...row }); S.lib.myfoods = S.lib.myfoods.slice(0, 200); saveLib();
}

/* ---------- recipes ---------- */
async function startRecipe(name, text, servings, totalGrams, servingName) {
  if (!name || !text) return;
  S.sheet = { type: 'food', food: { kind: 'log', stage: 'resolve', recipe: { name, servings: +servings || 1, totalGrams: +totalGrams || null, servingName: servingName || 'serving' }, text, items: [], busy: true } };
  render();
  if (!S.sample) { S.sheet.food.busy = false; S.sheet.food.err = 'Building a recipe needs Claude. Allow Claude for this page from the artifact menu.'; return render(); }
  try { S.sheet.food.items = await resolveItems(await aiParseFood(text)); } catch (e) { S.sheet.food.err = aiError(e); }
  S.sheet.food.busy = false; render();
}
function recipeTotals(items) { return items.reduce((t, it) => { const m = itemMacros(it); Object.keys(t).forEach(k => t[k] += m[k] || 0); return t; }, { kcal: 0, protein: 0, carbs: 0, fat: 0, fiber: 0 }); }
function saveRecipeFrom(f) {
  const tot = recipeTotals(f.items), n = f.recipe.servings || 1;
  const per = Object.fromEntries(Object.entries(tot).map(([k, v]) => [k, Math.round(v / n * 10) / 10]));
  const rec = { id: uid(), name: f.recipe.name.trim(), servings: n, totalGrams: f.recipe.totalGrams, servingName: f.recipe.servingName, perServing: per, total: tot, ingredients: f.items.map(it => ({ name: itemName(it), servings: it.servings })), text: f.text, created: today() };
  S.lib.recipes = (S.lib.recipes || []).filter(r => r.name.toLowerCase() !== rec.name.toLowerCase()).concat(rec);
  saveLib();
}
function saveMealFromDay(meal) {
  const items = day(S.foodDate).food.filter(x => (x.meal || 'Snacks') === meal); if (!items.length) return;
  const name = (S.ui.mealName || '').trim() || `My ${meal.toLowerCase()}`;
  const total = E.dayTotals(items);
  S.lib.meals = (S.lib.meals || []).filter(m => m.name.toLowerCase() !== name.toLowerCase()).concat({ id: uid(), name, total, items: items.map(i => i.name) });
  saveLib(); toast(`Saved "${name}". Type it next time to log it in one step.`);
}

/* ---------- session ---------- */
function startSession() {
  const t = today(), d = day(t);
  if ((d.workouts || []).some(w => !w.done)) { S.view = 'train'; return render(); }
  const plan = todaysPlan();
  const loc = plan.location || (S.profile.locations || ['gym'])[0];
  const pl = plan.type === 'train' ? plan : E.dailyPlan({ profile: S.profile, program: program(), workouts: allWorkouts(), checkin: d.checkin, checkins: checkinsMap(), today: t, location: loc === 'off' ? (S.profile.locations || ['gym'])[0] : loc, minutes: d.plan?.min || S.profile.sessionMin, setsHistory: setsHistory() });
  const w = {
    id: uid(), dayIndex: pl.dayIndex, dayName: pl.dayName, location: pl.location, startedAt: Date.now(), done: false, notes: pl.adjustments.slice(0, 4),
    items: pl.items.map(it => ({
      exId: it.ex.id, name: it.ex.name, muscle: it.muscle, loc: it.ex.loc, slotKey: it.slotKey, pair: it.pair || null, main: !!it.main, strength: it.strength || null,
      reps: it.reps, repTarget: it.repTarget, rir: it.rir, target: it.load, basis: it.basis, cue: it.ex.cue, rest: it.rest,
      sets: Array.from({ length: it.sets }, () => ({ load: it.load ?? null, reps: null, rir: null, done: false }))
    }))
  };
  d.workouts.push(w); saveDay(t); S.view = 'train'; render();
}
function activeWorkout() { return day(today()).workouts.find(w => !w.done); }

function setDone(i, j) {
  const w = activeWorkout(); const it = w.items[i]; const s = it.sets[j];
  readSetInputs(i, j);
  if (s.done) { s.done = false; s.hint = null; saveDay(today()); return render(); }
  if (s.reps == null || s.reps === '') s.reps = typeof it.repTarget === 'number' ? it.repTarget : parseInt(it.reps) || 8;
  if (s.load == null || s.load === '') s.load = it.target ?? null;
  if (s.rir == null) s.rir = it.rir;
  s.done = true;
  const ex = E.EXBYID[it.exId] || { loc: it.loc, inc: E.placeOf(it.loc).inc };
  const next = it.sets[j + 1];
  if (it.strength && it.strength.type === 'pr' && j === 0) {
    const rpe = 10 - (+s.rir);
    const bo = E.strBackoff(+s.load, +s.reps, rpe);
    s.hint = bo.note;
    if (bo.load) { while (it.sets.length < 4) it.sets.push({ load: bo.load, reps: null, rir: null, done: false }); it.sets.slice(1).forEach(x => { if (!x.done) x.load = bo.load; }); it.repTarget = bo.reps; }
    const og = S.profile.strength = S.profile.strength || {}; og.lastTop = og.lastTop || {}; og.lastTop[w.items[i].strength.lift] = { load: +s.load, reps: +s.reps, rpe }; saveProfile();
  } else if (next && !next.done && s.load != null && !it.strength) {
    const adj = E.nextSetLoad(ex, +s.load, it.rir, +s.rir, +s.reps, typeof it.repTarget === 'number' ? it.repTarget : parseInt(it.reps));
    if (adj) { next.load = adj.load; s.hint = adj.load !== +s.load ? adj.note : null; }
  }
  saveDay(today());
  const pairNext = it.pair ? w.items.find((x, k) => k !== i && x.pair === it.pair) : null;
  startRest(pairNext ? 60 : (it.rest || 120));
  render();
}
function readSetInputs(i, j) {
  const w = activeWorkout(); const s = w.items[i].sets[j];
  const l = $(`#s-${i}-${j}-l`), r = $(`#s-${i}-${j}-r`), x = $(`#s-${i}-${j}-x`);
  if (l && l.value !== '') s.load = +l.value; if (r && r.value !== '') s.reps = +r.value; if (x) s.rir = +x.value;
}
function finishSession() {
  const w = activeWorkout(); if (!w) return;
  w.items.forEach((it, i) => it.sets.forEach((s, j) => { if (!s.done) readSetInputs(i, j); }));
  w.done = true; w.finishedAt = Date.now();
  const sets = w.items.reduce((s, it) => s + it.sets.filter(x => x.done).length, 0);
  saveDay(today()); S.rest = null; clearInterval(restInt);
  toast(`Logged ${sets} sets. Next session is set from this one.`);
  S.view = 'today'; render();
}

async function handleFile(kind, file) {

async function lookupBarcode(code) {

async function runEstimate() {

/* ---------- weekly review ---------- */
function runReview() {
  const p = S.profile, T = targets(), n = nstate();
  const rv = E.weeklyReview(p, T, intakeByDate(), weights(), today(), { phaseStart: n.phaseStart, weeksInDeficit: weeksInDeficit() });
  let newKcal = T.base.kcal;
  if (rv.newTDEE) newKcal = E.calcTargets(p, { tdeeOverride: rv.newTDEE }).base.kcal;
  else if (rv.change) newKcal = T.base.kcal + rv.change;
  newKcal = Math.round(E.clamp(newKcal, T.base.kcal - 250, T.base.kcal + 250) / 10) * 10;   // smooth: max 250 kcal per week
  if (Math.abs(newKcal - T.base.kcal) === 250) rv.notes.push('Change capped at 250 kcal this week so one noisy stretch cannot swing the plan.');
  rv.newKcal = newKcal; S.ui.review = rv; render();
}
function applyReview() {
  const rv = S.ui.review, p = S.profile, T = targets(), n = nstate();
  const delta = rv.newKcal - T.base.kcal;
  n.tdeeOverride = (n.tdeeOverride || T.tdee) + delta;
  if (rv.dietBreak) { n.dietBreakUntil = E.addDays(today(), 13); n.deficitStart = E.addDays(today(), 14); }
  n.lastReview = today();
  n.history = (n.history || []).concat({ date: today(), from: T.base.kcal, to: rv.newKcal, notes: rv.notes }).slice(-30);
  if (rv.newTDEE || rv.change) { /* keep */ }
  S.ui.review = null; saveProfile(); toast(rv.dietBreak ? 'Diet break starts today' : `Target now ${fmt(rv.newKcal)} kcal`); render();
}

    case 'ef-meal': readEf(); S.sheet.edit.meal = v; render(); break;
    case 'ef-date': readEf(); S.sheet.edit.date = v; render(); break;
    case 'ef-qty': { readEf(); const e = S.sheet.edit; e.qty = Math.max(0.25, +(e.qty + +v).toFixed(2)); render(); break; }
    case 'ef-save': { readEf(); const e = S.sheet.edit, r = e.qty / (e.baseQty || 1);
      const src = day(e.origDate); const old = src.food.find(x => x.id === e.id) || {};
      src.food = src.food.filter(x => x.id !== e.id);
      const upd = { ...old, name: e.name || old.name, meal: e.meal, qty: e.qty, kcal: Math.round(e.base.kcal * r), protein: Math.round(e.base.protein * r), carbs: Math.round(e.base.carbs * r), fat: Math.round(e.base.fat * r), fiber: Math.round((e.base.fiber || 0) * r) };
      day(e.date).food.push(upd); saveDay(e.origDate); if (e.date !== e.origDate) saveDay(e.date);
      S.sheet = null; toast(e.date !== e.origDate ? 'Moved' : 'Saved'); render(); break; }
    case 'ef-dup': { readEf(); const e = S.sheet.edit, r = e.qty / (e.baseQty || 1); const t = today();
      day(t).food.push({ id: uid(), ts: Date.now(), name: e.name, meal: t === S.foodDate ? e.meal : defaultMeal(), qty: e.qty, kcal: Math.round(e.base.kcal * r), protein: Math.round(e.base.protein * r), carbs: Math.round(e.base.carbs * r), fat: Math.round(e.base.fat * r), fiber: Math.round((e.base.fiber || 0) * r), source: 'manual' });
      saveDay(t); S.sheet = null; toast('Logged again today'); render(); break; }
    case 'ef-del': if (!S.ui.efArm) { S.ui.efArm = true; render(); setTimeout(() => { S.ui.efArm = false; if (S.sheet?.type === 'editfood') render(); }, 6000); } else { const e = S.sheet.edit; const d = day(e.origDate); const gone = d.food.find(x => x.id === e.id); if (gone?.suppId && d.supps) d.supps = d.supps.filter(x => x !== gone.suppId); d.food = d.food.filter(x => x.id !== e.id); saveDay(e.origDate); S.sheet = null; S.ui.efArm = false; toast('Deleted'); render(); } break;
    case 'join-mode': S.ui.join = { mode: v }; render(); break;
    case 'copy-token': try { await navigator.clipboard.writeText(Api.token); toast('Sync code copied'); } catch (e) { const i = $('#sync-code'); i?.select(); toast('Select and copy the code'); } break;
    case 'signout': Api.token = ''; try { ['profile', 'lib', 'days', 'pending'].forEach(k => localStorage.removeItem('fc:' + k)); } catch (e) {} S.profile = null; S.days = {}; S.sheet = null; S.needJoin = true; render(); break;
    case 'log-cond': { const d = day(today()); d.workouts.push({ id: uid(), kind: 'conditioning', dayName: 'Conditioning', location: 'p1', done: true, startedAt: Date.now(), finishedAt: Date.now(), items: [] }); saveDay(today()); toast('Conditioning logged'); render(); break; }
    case 'brief': S.brief = { text: '', loading: true }; render(); try { await aiBrief(({ text }) => { S.brief.text = text; const m = document.querySelector('.msg.ai'); if (m) m.textContent = text; }); } catch (e) { S.brief.text = aiError(e); } S.brief.loading = false; render(); break;
    // session
    case 'set-done': setDone(+el.dataset.i, +el.dataset.j); break;
    case 'set-add': { const it = activeWorkout().items[+el.dataset.i]; const last = it.sets[it.sets.length - 1]; it.sets.push({ load: last?.load ?? it.target, reps: null, rir: null, done: false }); saveDay(today()); render(); break; }
    case 'set-remove': { const it = activeWorkout().items[+el.dataset.i]; const k = it.sets.map(s => s.done).lastIndexOf(false); it.sets.splice(k >= 0 ? k : it.sets.length - 1, 1); saveDay(today()); render(); break; }
    case 'finish-session': finishSession(); break;
    case 'discard-session': if (!S.ui.discardArm) { S.ui.discardArm = true; render(); setTimeout(() => { S.ui.discardArm = false; render(); }, 6000); } else { const d = day(today()); d.workouts = d.workouts.filter(w => w.done); S.ui.discardArm = false; saveDay(today()); S.rest = null; render(); } break;
    case 'swap-open': openSheet({ type: 'swap', i: +el.dataset.i }); break;
    case 'swap-do': {
      const w = activeWorkout(), it = w.items[+el.dataset.i], ex = E.EXBYID[v];
      const sug = E.suggestLoad(ex, setsHistory()[ex.id], typeof it.repTarget === 'number' ? it.repTarget : ex.rr[0] + 2, it.rir, {});
      Object.assign(it, { exId: ex.id, name: ex.name, cue: ex.cue, reps: `${ex.rr[0]}-${ex.rr[1]}`, target: sug.load, basis: sug.basis });
      it.sets.forEach(s => { if (!s.done) s.load = sug.load; });
      if (el.dataset.keep && it.slotKey) { S.profile.swaps = S.profile.swaps || {}; S.profile.swaps[it.slotKey + '@' + it.loc] = ex.id; saveProfile(); }
      saveDay(today()); closeSheet(); break;
    }
    case 'avoid-ex': { const it = activeWorkout().items[+el.dataset.i]; S.profile.avoid = [...new Set([...(S.profile.avoid || []), it.exId])]; saveProfile(); toast(`${it.name} removed from future plans`); closeSheet(); break; }
    case 'add-exercise': openSheet({ type: 'addex' }); break;
    case 'add-ex-do': { const ex = E.EXBYID[v], w = activeWorkout(); const sug = E.suggestLoad(ex, setsHistory()[ex.id], ex.rr[0] + 2, ex.type === 'compound' ? 2 : 1, {}); w.items.push({ exId: ex.id, name: ex.name, muscle: ex.m, loc: ex.loc, reps: `${ex.rr[0]}-${ex.rr[1]}`, repTarget: ex.rr[0] + 2, rir: ex.type === 'compound' ? 2 : 1, target: sug.load, basis: sug.basis, cue: ex.cue, rest: ex.type === 'compound' ? 150 : 90, sets: [0, 1, 2].map(() => ({ load: sug.load, reps: null, rir: null, done: false })) }); saveDay(today()); closeSheet(); break; }
    case 'rest-add': if (S.rest) S.rest.end += 30000; break;
    case 'rest-skip': S.rest = null; clearInterval(restInt); render(); break;
    // food
    case 'food-day': { const nd = E.addDays(S.foodDate, +v); if (nd <= today()) { S.foodDate = nd; render(); } break; }
    case 'food-photo': if (!el.disabled) openFood('photo'); break;
    case 'food-label': if (!el.disabled) openFood('label'); break;
    case 'food-barcode': openFood('barcode', { live: LiveScan.supported() }); if (LiveScan.supported()) setTimeout(startScan, 50); break;
    case 'scan-live': S.sheet.food.live = true; render(); setTimeout(startScan, 50); break;
    case 'scan-stop': LiveScan.stop(); S.sheet.food.live = false; render(); break;
    case 'food-describe': if (!el.disabled) openFood('describe'); break;
    case 'food-quick': openFood('quick', { q: {} }); break;
    case 'food-search': openSheet({ type: 'search', search: {} }); break;
    case 'food-recipes': openSheet({ type: 'recipes' }); break;
    case 'sheet-close': closeSheet(); break;
    case 'sr-pick': { const s = S.sheet.search; const row = (s.q ? s.rows : S.lib.myfoods)[+v]; pickToLog(row); break; }
    case 'lg-step': { readLg(); const it = S.sheet.food.items[+el.dataset.k]; it.servings = Math.max(0.25, +(it.servings + +v).toFixed(2)); render(); break; }
    case 'lg-del': readLg(); S.sheet.food.items.splice(+el.dataset.k, 1); S.ui.altOpen = null; render(); break;
    case 'lg-alt': readLg(); S.ui.altOpen = S.ui.altOpen === +el.dataset.k ? null : +el.dataset.k; render(); break;
    case 'lg-pick': { readLg(); const it = S.sheet.food.items[+el.dataset.k]; it.pick = +v; it.servings = it.pick >= 0 ? servingsFor(it.cands[it.pick], it) : 1; S.ui.altOpen = null; render(); break; }
    case 'lg-save': readLg(); saveLogged(); break;
    case 'rc-log': { const r = S.lib.recipes.find(x => x.id === v); S.sheet = { type: 'food', food: { kind: 'log', stage: 'resolve', text: '1 ' + r.servingName + ' ' + r.name, local: true, meal: S.foodDate === today() ? defaultMeal() : 'Snacks', items: [{ text: r.name, kind: 'recipe', name: r.name, servings: 1, per: r.perServing, unitLabel: r.servingName }] } }; render(); break; }
    case 'rc-del': if (S.ui.rcArm !== v) { S.ui.rcArm = v; render(); } else { S.lib.recipes = S.lib.recipes.filter(x => x.id !== v); S.ui.rcArm = null; saveLib(); render(); } break;
    case 'ml-log': { const r = S.lib.meals.find(x => x.id === v); S.sheet = { type: 'food', food: { kind: 'log', stage: 'resolve', text: r.name, local: true, meal: S.foodDate === today() ? defaultMeal() : 'Snacks', items: [{ text: r.name, kind: 'meal', name: r.name, servings: 1, per: r.total, unitLabel: 'meal' }] } }; render(); break; }
    case 'ml-del': if (S.ui.mlArm !== v) { S.ui.mlArm = v; render(); } else { S.lib.meals = S.lib.meals.filter(x => x.id !== v); S.ui.mlArm = null; saveLib(); render(); } break;
    case 'meal-save': S.ui.mealSave = S.ui.mealSave === v ? null : v; S.ui.mealName = ''; render(); break;
    case 'food-recent': { const r = S.lib.recent[+v]; openFood('quick', { q: { ...r } }); break; }
    case 'food-del': { if (S.ui.delArm !== v) { S.ui.delArm = v; render(); setTimeout(() => { if (S.ui.delArm === v) { S.ui.delArm = null; render(); } }, 6000); } else { const d = day(S.foodDate); d.food = d.food.filter(f => f.id !== v); S.ui.delArm = null; saveDay(S.foodDate); render(); } break; }
    case 'fs-meal': readReviewInputs(); captureFs(); S.sheet.food.meal = v; render(); break;
    case 'fs-estimate': captureFs(); runEstimate(); break;
    case 'fs-readlabel': captureFs(); runLabel(); break;
    case 'fs-code': captureFs(); { const c = (S.sheet.food.code || '').replace(/\D/g, ''); if (c.length >= 6) lookupBarcode(c); else { S.sheet.food.err = 'Enter the full barcode number.'; render(); } } break;
    case 'fs-mult': readReviewInputs(); S.sheet.food.mult = Math.max(0.5, (+S.sheet.food.mult || 1) + +v); render(); break;
    case 'fs-mult-set': readReviewInputs(); S.sheet.food.mult = +v; render(); break;
    case 'fr-del': readReviewInputs(); S.sheet.food.items.splice(+el.dataset.k, 1); if (!S.sheet.food.items.length) S.sheet.food.stage = 'capture'; render(); break;
    case 'fs-back': S.sheet.food.stage = 'capture'; render(); break;
    case 'fs-save': saveReview(); break;
    case 'fs-quick-save': { captureFs(); const q = S.sheet.food.q || {}; const P = +q.protein || 0, C = +q.carbs || 0, F = +q.fat || 0; const K = q.kcal ? +q.kcal : P * 4 + C * 4 + F * 9; if (!K) { S.sheet.food.err = 'Enter calories or at least one macro.'; return render(); } addFood({ name: q.name || 'Quick add', kcal: K, protein: P, carbs: C, fat: F, meal: S.sheet.food.meal, source: 'manual' }); S.sheet = null; toast('Added'); render(); break; }
    // progress
    case 'review-run': runReview(); break;
    case 'review-apply': applyReview(); break;
    case 'review-dismiss': nstate().lastReview = today(); saveProfile(); S.ui.review = null; render(); break;
    // coach
    case 'coach-tab': S.ui.coachTab = v; render(); break;
    case 'chat-sugg': sendChat(v); break;
    case 'chat-clear': S.chat = []; render(); break;
    case 'protocol': if (S.ui.protoArm !== v) { S.ui.protoArm = v; render(); setTimeout(() => { if (S.ui.protoArm === v) { S.ui.protoArm = null; render(); } }, 6000); } else { S.profile.protocol = v; S.profile.nutrition.protocolStart = today(); S.profile.nutrition.phaseStart = today(); S.ui.protoArm = null; saveProfile(); toast(`${E.PROTOCOLS[v].name} is active`); render(); } break;
    // settings
    case 'theme': applyTheme(v); if (S.profile) { S.profile.skin = v; saveProfile(); } render(); break;
    case 'export': exportData(); break;
    case 'wipe': if (!S.ui.wipeArm) { S.ui.wipeArm = true; render(); setTimeout(() => { S.ui.wipeArm = false; if (S.sheet) render(); }, 6000); } else { await Store.wipe(); S.profile = null; S.days = {}; S.lib = { barcodes: {}, recent: [] }; S.sheet = null; S.ui.wipeArm = false; S.ob = null; render(); } break;
    case 'og-save': {
      const og = S.profile.strength = S.profile.strength || {}; og.sets = og.sets || {}; og.tm = og.tm || {};
      ['squat', 'bench', 'deadlift', 'ohp'].forEach(l => { const w = +($(`#og-${l}-w`)?.value || 0), r = +($(`#og-${l}-r`)?.value || 0); if (w && r) { og.sets[l] = { w, r }; const e1 = Math.round(w / (1.0278 - 0.0278 * r)); og.tm[l] = E.strBase(e1); } });
      og.start = today(); saveProfile(); toast('Saved. Your strength plan starts today.'); render(); break;
    }
  }
});

document.addEventListener('change', (ev) => {
  const el = ev.target;
  if (el.dataset.file) { const file = el.files?.[0]; if (file) handleFile(el.dataset.file, file); }
  if (el.id === 'ef-date' || el.id === 'ef-qty') { readEf(); render(); }
  if (el.dataset.lg) { readLg(); render(); }
  if (el.dataset.set) { const [i, j] = [+el.dataset.i, +el.dataset.j]; readSetInputs(i, j); saveDay(today()); }
});
document.addEventListener('input', (ev) => {
  const el = ev.target;
  if (el.dataset.ob && S.ob) { S.ob.a[el.dataset.ob] = el.value; const btn = document.querySelector('[data-act="ob-next"]'); if (btn) btn.disabled = !obValid(S.ob.step, { ...S.ob.a, [el.dataset.ob]: el.value }); }
});
document.addEventListener('submit', (ev) => {
  ev.preventDefault();
  const fm = ev.target.dataset.form;
  if (fm === 'join') { doJoin(); return; }
  if (fm === 'chat') { const i = $('#chat-in'); const t = i.value; i.value = ''; sendChat(t); }
  if (fm === 'log') { const i = ev.target.querySelector('textarea,input'); const t = i.value; i.value = ''; startLog(t); }
  if (fm === 'recipe') { startRecipe($('#rc-name').value, $('#rc-text').value, $('#rc-serv').value, $('#rc-grams').value, $('#rc-sname').value || 'serving'); }
  if (fm === 'mealsave') { S.ui.mealName = $('#ms-name').value; saveMealFromDay(ev.target.dataset.v); S.ui.mealSave = null; render(); }
  if (fm === 'search') { const q = $('#sr-q').value.trim(); const s = S.sheet.search; s.q = q; s.busy = true; s.err = null; render(); FoodDB.search(q, '', 25).then(r => { s.rows = r; }).catch(() => { s.err = 'The food database did not load. Check your connection.'; }).finally(() => { s.busy = false; render(); }); }
});
window.addEventListener('scroll', () => { const t = $('.top'); if (t) t.classList.toggle('scrolled', window.scrollY > 4); }, { passive: true });

function readLg() { document.querySelectorAll('[data-lg]').forEach(el => { const it = S.sheet?.food?.items?.[+el.dataset.k]; if (it && el.value !== '') it.servings = Math.max(0.05, +el.value || it.servings); }); }
function readEf() {
  const e = S.sheet?.edit; if (!e) return;
  const nm = $('#ef-name'); if (nm) e.name = nm.value;
  const dt = $('#ef-date'); if (dt && dt.value && dt.value <= today() && dt.value !== e.date && !S.ui.efDateClicked) e.date = dt.value;
  const qi = $('#ef-qty'); const newQ = qi ? Math.max(0.05, +qi.value || e.qty) : e.qty;
  // typed macros win: fold them back into the base so later amount changes scale from them
  const r = e.qty / (e.baseQty || 1);
  ['kcal', 'protein', 'carbs', 'fat'].forEach(k => { const el = $('#ef-' + k); if (el && el.value !== '' && Math.round(e.base[k] * r) !== +el.value) e.base[k] = +el.value / (r || 1); });
  e.qty = newQ;
}
function captureOb() { document.querySelectorAll('[data-ob]').forEach(el => { S.ob.a[el.dataset.ob] = el.value; }); document.querySelectorAll('[data-sup]').forEach(el => { const [i, k] = el.dataset.sup.split('-'); const x = S.ob.a.supps?.[+i]; if (x) x[k] = el.value; }); }
function captureCi() { document.querySelectorAll('[data-ci]').forEach(el => { S.ui.ci[el.dataset.ci] = el.value; }); }
function captureFs() {
  const f = S.sheet?.food; if (!f) return;
  document.querySelectorAll('[data-fs]').forEach(el => { f[el.dataset.fs] = el.value; });
  document.querySelectorAll('[data-q]').forEach(el => { f.q = f.q || {}; f.q[el.dataset.q] = el.value; });
}

/* ============================================================
   BOOT
   ============================================================ */
(async function boot() {
  let sk = null; try { sk = localStorage.getItem('fc:skin'); } catch (e) {} applyTheme(sk || 'auto');
  render();
  await Store.init();
  try {
    const data = await Store.loadAll();
    S.profile = migrateProfile(data.profile); S.lib = { barcodes: {}, recent: [], ...(data.lib || {}) }; S.days = data.days || {};
    if (S.profile?.skin && S.profile.skin !== S.ui.theme) applyTheme(S.profile.skin);
    if (Store.mode === 'api' && S.profile) Oura.status().then(c => { if (c) Oura.sync(false); render(); });
  } catch (e) { console.error(e); toast('Could not load your data. Showing a fresh start.'); }
  render();
  initSample();
})();


</script>
<script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
